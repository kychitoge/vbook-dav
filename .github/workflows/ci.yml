name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run static analysis (go vet)
        run: go vet ./...

      - name: Run unit and adversarial tests
        run: go test -v -count=1 -p 1 ./internal/config ./internal/storage/local ./internal/webdav ./internal/r2sync ./internal/notify

      - name: Verify application build
        run: go build -v -ldflags="-s -w" -trimpath ./cmd/dav
